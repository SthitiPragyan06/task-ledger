<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#171b26;
    --ink-soft:#242b3d;
    --ledger:#f4efe4;
    --ledger-line:#d8cfb8;
    --paper-shadow: rgba(0,0,0,0.35);
    --accent:#2e7d6b;
    --accent-soft:#bfe0d6;
    --high:#b3402f;
    --med:#c98a2c;
    --low:#4c7a52;
    --muted:#8a90a0;
    --text-on-ink:#e9e6dc;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--ink);
    background-image:
      radial-gradient(ellipse at top left, rgba(46,125,107,0.10), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(179,64,47,0.08), transparent 50%);
    font-family:'Inter', sans-serif;
    color:var(--text-on-ink);
    padding:48px 20px 80px;
  }
  .wrap{max-width:760px; margin:0 auto;}
  header{margin-bottom:28px;}
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent-soft); margin:0 0 6px;
  }
  h1{
    font-family:'Fraunces', serif; font-weight:600;
    font-size:clamp(32px,5vw,44px); margin:0 0 6px; line-height:1.05;
  }
  .sub{color:var(--muted); font-size:14.5px; margin:0;}

  .stats{
    display:flex; gap:18px; margin:22px 0 26px; flex-wrap:wrap;
  }
  .stat{
    font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--muted);
    border:1px solid rgba(233,230,220,0.15); padding:8px 12px; border-radius:6px;
    display:flex; align-items:center; gap:8px;
  }
  .stat b{color:var(--text-on-ink); font-size:15px; font-family:'Inter',sans-serif; font-weight:600;}
  .bar{width:120px; height:6px; background:rgba(233,230,220,0.12); border-radius:4px; overflow:hidden;}
  .bar > div{height:100%; background:var(--accent); transition:width .3s ease;}

  .ledger{
    background:var(--ledger);
    color:#2a2620;
    border-radius:4px;
    box-shadow:0 30px 60px -20px var(--paper-shadow), 0 0 0 1px rgba(0,0,0,0.2);
    padding:6px 0 10px;
    position:relative;
  }
  .ledger::before{
    content:"";
    position:absolute; left:56px; top:0; bottom:0; width:1px;
    background:rgba(179,64,47,0.25);
  }

  .add-row{
    display:flex; gap:8px; padding:20px 24px 18px 70px; border-bottom:1px solid var(--ledger-line);
    flex-wrap:wrap;
  }
  .add-row input[type=text]{
    flex:1 1 220px; border:none; background:transparent; font-family:'Inter',sans-serif;
    font-size:15px; padding:8px 2px; border-bottom:1px solid transparent; outline:none; color:#2a2620;
  }
  .add-row input[type=text]:focus{border-bottom:1px solid var(--accent);}
  .add-row input[type=text]::placeholder{color:#9a927c;}
  select, .add-row input[type=date]{
    font-family:'JetBrains Mono', monospace; font-size:12px; background:#fff;
    border:1px solid var(--ledger-line); border-radius:4px; padding:7px 8px; color:#4a4536;
  }
  .add-btn{
    font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:.05em;
    background:var(--ink); color:var(--text-on-ink); border:none; border-radius:4px;
    padding:9px 16px; cursor:pointer; transition:background .15s;
  }
  .add-btn:hover{background:var(--accent);}

  .filters{
    display:flex; gap:2px; padding:14px 24px 4px 70px; border-bottom:1px solid var(--ledger-line);
  }
  .filters button{
    font-family:'JetBrains Mono', monospace; font-size:11.5px; letter-spacing:.05em;
    background:none; border:none; color:#8a806a; padding:6px 12px; cursor:pointer;
    border-bottom:2px solid transparent; text-transform:uppercase;
  }
  .filters button.active{color:#2a2620; border-bottom-color:var(--high); font-weight:600;}
  .search{
    margin-left:auto; font-family:'JetBrains Mono', monospace; font-size:12px;
    border:none; background:transparent; border-bottom:1px solid var(--ledger-line);
    padding:5px 2px; outline:none; width:130px; color:#2a2620;
  }

  ul#list{list-style:none; margin:0; padding:8px 0;}
  .item{
    display:flex; align-items:flex-start; gap:12px;
    padding:13px 24px 13px 20px; position:relative;
    border-bottom:1px dashed var(--ledger-line);
    cursor:grab;
  }
  .item.dragging{opacity:.4;}
  .item .num{
    font-family:'JetBrains Mono', monospace; font-size:11px; color:#b0a688; width:36px; text-align:right;
    padding-top:3px; flex-shrink:0;
  }
  .check{
    width:18px; height:18px; border-radius:50%; border:2px solid #b0a688; flex-shrink:0; margin-top:2px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.15s;
  }
  .check.done{background:var(--accent); border-color:var(--accent);}
  .check.done::after{content:"✓"; color:#fff; font-size:11px;}
  .body-col{flex:1; min-width:0;}
  .title{font-size:15px; line-height:1.4; word-break:break-word;}
  .item.done .title{text-decoration:line-through; color:#a39c88;}
  .meta{display:flex; gap:8px; margin-top:5px; flex-wrap:wrap; align-items:center;}
  .tag{
    font-family:'JetBrains Mono', monospace; font-size:10.5px; padding:2px 7px; border-radius:3px;
    text-transform:uppercase; letter-spacing:.03em;
  }
  .tag.high{background:rgba(179,64,47,0.12); color:var(--high);}
  .tag.med{background:rgba(201,138,44,0.14); color:var(--med);}
  .tag.low{background:rgba(76,122,82,0.14); color:var(--low);}
  .due{font-family:'JetBrains Mono', monospace; font-size:10.5px; color:#8a806a;}
  .due.overdue{color:var(--high); font-weight:600;}
  .cat{font-family:'JetBrains Mono', monospace; font-size:10.5px; color:#8a806a;}
  .del{
    background:none; border:none; color:#c2b89c; cursor:pointer; font-size:16px; padding:2px 6px;
    opacity:0; transition:opacity .15s;
  }
  .item:hover .del{opacity:1;}
  .del:hover{color:var(--high);}

  .empty{padding:40px 24px 40px 70px; color:#a39c88; font-size:13.5px; font-family:'JetBrains Mono', monospace;}

  footer{text-align:center; margin-top:22px; color:var(--muted); font-size:12px; font-family:'JetBrains Mono', monospace;}
  footer a{color:var(--accent-soft);}

  @media (max-width: 520px){
    .ledger::before{left:20px;}
    .add-row, .filters, .empty{padding-left:24px;}
    .item .num{display:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">// daily objectives</p>
    <h1>Task Ledger</h1>
    <p class="sub">A no-nonsense to-do list. Entries persist locally in your browser.</p>
  </header>

  <div class="stats">
    <div class="stat">Open <b id="statOpen">0</b></div>
    <div class="stat">Done <b id="statDone">0</b></div>
    <div class="stat">Overdue <b id="statOverdue">0</b></div>
    <div class="stat">Progress
      <div class="bar"><div id="progressBar" style="width:0%"></div></div>
      <b id="statPct">0%</b>
    </div>
  </div>

  <div class="ledger">
    <div class="add-row">
      <input type="text" id="taskInput" placeholder="Add a task and press enter…" maxlength="140">
      <select id="priorityInput">
        <option value="low">Low</option>
        <option value="med" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <input type="text" id="categoryInput" placeholder="category" style="width:90px; font-family:'JetBrains Mono',monospace; font-size:12px; border:1px solid var(--ledger-line); border-radius:4px; padding:7px 8px; background:#fff;">
      <input type="date" id="dueInput">
      <button class="add-btn" id="addBtn">ADD</button>
    </div>

    <div class="filters">
      <button data-filter="all" class="active">All</button>
      <button data-filter="active">Active</button>
      <button data-filter="done">Done</button>
      <input type="text" class="search" id="searchInput" placeholder="search…">
    </div>

    <ul id="list"></ul>
    <div class="empty" id="emptyState" style="display:none;">Ledger is clear. Add something above.</div>
  </div>

  <footer>Data stored in localStorage · no backend, no tracking</footer>
</div>

<script>
(function(){
  const STORAGE_KEY = 'task-ledger-items-v1';
  let items = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let filter = 'all';
  let dragIndex = null;

  const list = document.getElementById('list');
  const emptyState = document.getElementById('emptyState');
  const taskInput = document.getElementById('taskInput');
  const priorityInput = document.getElementById('priorityInput');
  const categoryInput = document.getElementById('categoryInput');
  const dueInput = document.getElementById('dueInput');
  const searchInput = document.getElementById('searchInput');

  function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); render(); }

  function isOverdue(item){
    if(!item.due || item.done) return false;
    const today = new Date(); today.setHours(0,0,0,0);
    return new Date(item.due) < today;
  }

  function render(){
    const query = searchInput.value.trim().toLowerCase();
    let filtered = items.filter(it => {
      if(filter === 'active' && it.done) return false;
      if(filter === 'done' && !it.done) return false;
      if(query && !it.title.toLowerCase().includes(query)) return false;
      return true;
    });

    list.innerHTML = '';
    emptyState.style.display = filtered.length ? 'none' : 'block';

    filtered.forEach((it) => {
      const realIndex = items.indexOf(it);
      const li = document.createElement('li');
      li.className = 'item' + (it.done ? ' done' : '');
      li.draggable = true;
      li.dataset.index = realIndex;

      const overdue = isOverdue(it);
      li.innerHTML = `
        <span class="num">${String(realIndex+1).padStart(2,'0')}</span>
        <div class="check ${it.done ? 'done':''}" data-action="toggle"></div>
        <div class="body-col">
          <div class="title">${escapeHtml(it.title)}</div>
          <div class="meta">
            <span class="tag ${it.priority}">${it.priority}</span>
            ${it.category ? `<span class="cat">#${escapeHtml(it.category)}</span>` : ''}
            ${it.due ? `<span class="due ${overdue?'overdue':''}">${overdue?'overdue · ':''}${it.due}</span>` : ''}
          </div>
        </div>
        <button class="del" data-action="delete">✕</button>
      `;
      list.appendChild(li);
    });

    const open = items.filter(i=>!i.done).length;
    const done = items.filter(i=>i.done).length;
    const overdue = items.filter(isOverdue).length;
    const pct = items.length ? Math.round((done/items.length)*100) : 0;
    document.getElementById('statOpen').textContent = open;
    document.getElementById('statDone').textContent = done;
    document.getElementById('statOverdue').textContent = overdue;
    document.getElementById('statPct').textContent = pct + '%';
    document.getElementById('progressBar').style.width = pct + '%';
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function addTask(){
    const title = taskInput.value.trim();
    if(!title) return;
    items.push({
      title,
      priority: priorityInput.value,
      category: categoryInput.value.trim(),
      due: dueInput.value,
      done: false
    });
    taskInput.value = '';
    categoryInput.value = '';
    dueInput.value = '';
    save();
    taskInput.focus();
  }

  document.getElementById('addBtn').addEventListener('click', addTask);
  taskInput.addEventListener('keydown', e => { if(e.key === 'Enter') addTask(); });
  searchInput.addEventListener('input', render);

  document.querySelectorAll('.filters button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      filter = btn.dataset.filter;
      render();
    });
  });

  list.addEventListener('click', e=>{
    const action = e.target.dataset.action;
    if(!action) return;
    const li = e.target.closest('.item');
    const idx = parseInt(li.dataset.index, 10);
    if(action === 'toggle'){ items[idx].done = !items[idx].done; save(); }
    if(action === 'delete'){ items.splice(idx,1); save(); }
  });

  list.addEventListener('dragstart', e=>{
    const li = e.target.closest('.item');
    dragIndex = parseInt(li.dataset.index, 10);
    li.classList.add('dragging');
  });
  list.addEventListener('dragend', e=>{
    e.target.closest('.item')?.classList.remove('dragging');
  });
  list.addEventListener('dragover', e=>{
    e.preventDefault();
    const li = e.target.closest('.item');
    if(!li) return;
    const overIndex = parseInt(li.dataset.index, 10);
    if(overIndex === dragIndex || dragIndex === null) return;
    const [moved] = items.splice(dragIndex, 1);
    items.splice(overIndex, 0, moved);
    dragIndex = overIndex;
    render();
  });

  render();
})();
</script>
</body>
</html>
